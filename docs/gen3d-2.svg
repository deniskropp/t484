      <svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>
        
        <!-- Node-01: The Anchor -->
        <path d="M100 150 L200 200 L200 250 L100 200 Z" fill="#1a252f" stroke="#00ffcc" stroke-width="2"/>
        <text x="150" y="210" font-family="monospace" font-size="12" fill="#00ffcc" text-anchor="middle">NODE-01</text>

        <!-- KLMX-1: The Luminous Bridge -->
        <ellipse cx="300" cy="120" rx="50" ry="25" fill="#ff00ff" filter="url(#glow)" opacity="0.6"/>
        <text x="300" y="125" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">KLMX-1</text>

        <!-- Node-02: The Expansion -->
        <path d="M400 200 L500 150 L500 200 L400 250 Z" fill="#1a252f" stroke="#00ffcc" stroke-width="2"/>
        <text x="500" y="160" font-family="monospace" font-size="12" fill="#00ffcc" text-anchor="middle">NODE-02</text>
        
        <!-- Mettā Conduits -->
        <path d="M200 175 Q300 80 400 175" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
      </svg>
