      <svg width="500" height="250" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#00ffcc" />
          </marker>
        </defs>
        <!-- Node-01 -->
        <rect x="50" y="75" width="120" height="100" rx="10" fill="#2c3e50" stroke="#00ffcc" stroke-width="2"/>
        <text x="110" y="130" font-family="monospace" font-size="12" fill="#00ffcc" text-anchor="middle">NODE-01</text>
        
        <!-- KLMX-1 -->
        <rect x="330" y="75" width="120" height="100" rx="10" fill="#2c3e50" stroke="#ff00ff" stroke-width="2"/>
        <text x="390" y="130" font-family="monospace" font-size="12" fill="#ff00ff" text-anchor="middle">KLMX-1</text>
        
        <!-- Connection -->
        <line x1="170" y1="125" x2="330" y2="125" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
        <text x="250" y="110" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">TRANSPORT</text>
      </svg>
