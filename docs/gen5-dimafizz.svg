      <svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="grad5" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.2" />
          </radialGradient>
        </defs>
        
        <!-- The Pentad (5-Point Star-Polytope) -->
        <polygon points="250,50 350,150 450,150 350,250 400,400 250,300 100,400 150,250 50,150 150,150" 
                 fill="url(#grad5)" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
        
        <!-- Probability Nodes -->
        <circle cx="250" cy="50" r="8" fill="#fff"/>
        <circle cx="350" cy="150" r="8" fill="#fff"/>
        <circle cx="150" cy="150" r="8" fill="#fff"/>
        <circle cx="250" cy="300" r="8" fill="#fff"/>
        <circle cx="250" cy="200" r="15" fill="none" stroke="#00ffff" stroke-width="3"/>
        
        <text x="250" y="480" font-family="monospace" font-size="14" fill="#00ffff" text-anchor="middle">PROBABILITY_SUPERPOSITION_FIELD</text>
      </svg>
