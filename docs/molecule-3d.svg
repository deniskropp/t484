      <svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0a0a0c;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="500" height="500" fill="url(#grad1)" />
        
        <!-- Isometric Grid Base -->
        <path d="M50 250 L250 350 L450 250 L250 150 Z" fill="none" stroke="#333" stroke-width="1"/>
        
        <!-- Manifold Surface -->
        <polygon points="150,200 350,300 350,400 150,300" fill="#00ff9d" fill-opacity="0.15" stroke="#00ff9d" />
        
        <!-- Void-Pocket (3D Depth) -->
        <ellipse cx="250" cy="250" rx="50" ry="25" fill="#ff0055" fill-opacity="0.3" stroke="#ff0055" />
        <path d="M250 250 L250 180" stroke="#ff0055" stroke-dasharray="4" />
        <circle cx="250" cy="180" r="10" fill="#ff0055" />
        
        <!-- Interference Field -->
        <path d="M350 350 Q400 300 450 350 T500 350" fill="none" stroke="#00d4ff" stroke-width="2" />
        
        <text x="20" y="480" fill="#ffffff" font-family="monospace" font-size="12">
          [3D_PROJECTION] Manifold Depth: 6D-Z-Axis | Anomaly: VOID-01
