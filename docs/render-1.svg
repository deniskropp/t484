  <svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect width="500" height="300" fill="url(#grad1)" />
    
    <!-- Manifold Grid -->
    <path d="M0 150 L500 150 M250 0 L250 300" stroke="#4e4e6a" stroke-width="0.5" />
    
    <!-- K-Node Cluster -->
    <g fill="#4cc9f0">
      <circle cx="250" cy="150" r="40" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-dasharray="5 5">
        <animateTransform attributeName="transform" type="rotate" from="0 250 150" to="360 250 150" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="150" r="5" />
      <text x="260" y="145" fill="#ffffff" font-family="sans-serif" font-size="10">K-Node_Core</text>
    </g>
    
    <!-- Data Flow Vectors -->
    <path d="M50 50 Q 250 150 450 250" stroke="#f72585" fill="none" stroke-width="2" />
  </svg>
