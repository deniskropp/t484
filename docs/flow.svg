      <svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
        <rect width="700" height="300" fill="#121212" rx="10"/>
        
        <!-- Flow Pipeline -->
        <circle cx="100" cy="150" r="40" fill="#2c3e50" stroke="#3498db" stroke-width="3"/>
        <text x="100" y="155" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">INPUT</text>
        
        <rect x="200" y="130" width="100" height="40" fill="#2c3e50" stroke="#f1c40f" stroke-width="2" rx="5"/>
        <text x="250" y="155" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">PROCESS</text>
        
        <rect x="350" y="130" width="100" height="40" fill="#2c3e50" stroke="#e67e22" stroke-width="2" rx="5"/>
        <text x="400" y="155" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">EXEC</text>
        
        <circle cx="550" cy="150" r="40" fill="#2c3e50" stroke="#27ae60" stroke-width="3"/>
        <text x="550" y="155" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">OUTPUT</text>
        
        <!-- Connectors -->
        <line x1="140" y1="150" x2="200" y2="150" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="300" y1="150" x2="350" y2="150" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="450" y1="150" x2="510" y2="150" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
        
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
          </marker>
        </defs>
      </svg>
