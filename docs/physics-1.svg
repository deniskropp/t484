<svg xmlns="http://w3.org" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Grid Line Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Singularity Gradient -->
    <radialGradient id="singularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#0055ff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#aa00ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Particle Glow -->
    <radialGradient id="particle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Space Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />

  <!-- Ambient Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1" />
    <circle cx="340" cy="50" r="1.5" />
    <circle cx="710" cy="150" r="1" />
    <circle cx="650" cy="420" r="1.2" />
    <circle cx="180" cy="390" r="1" />
    <circle cx="90" cy="270" r="1.5" />
    <circle cx="480" cy="450" r="1" />
  </g>

  <!-- System Matrix Title Block -->
  <text x="30" y="40" font-family="monospace" font-size="12" fill="#00ffff" opacity="0.8" letter-spacing="1.5">PROTOCOL: ⫻DISPLAY/RENDER:IMAGE/SVG</text>
  <text x="30" y="58" font-family="monospace" font-size="10" fill="#5577aa" opacity="0.6">MOLECULE: GenerativeWidget // STATE: Active</text>
  <line x1="30" y1="70" x2="320" y2="70" stroke="#00ffff" stroke-opacity="0.3" stroke-width="1" />

  <!-- Target Frame Interface Elements -->
  <path d="M 25 35 L 25 25 L 35 25" stroke="#00ffff" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 775 35 L 775 25 L 765 25" stroke="#00ffff" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 25 465 L 25 475 L 35 475" stroke="#00ffff" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 775 465 L 775 475 L 765 475" stroke="#00ffff" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Spacetime Metric Grid Layer (Warped Grid Visualisation) -->
  <g filter="url(#glow)">
    <!-- Concentric Gravity Contour Rings -->
    <ellipse cx="400" cy="270" rx="320" ry="160" fill="none" stroke="#0055ff" stroke-width="0.5" stroke-opacity="0.2" />
    <ellipse cx="400" cy="270" rx="270" ry="135" fill="none" stroke="#0055ff" stroke-width="0.6" stroke-opacity="0.3" />
    <ellipse cx="400" cy="270" rx="220" ry="110" fill="none" stroke="#0077ff" stroke-width="0.8" stroke-opacity="0.4" />
    <ellipse cx="400" cy="270" rx="170" ry="85"  fill="none" stroke="#00aaff" stroke-width="1.0" stroke-opacity="0.6" />
    <ellipse cx="400" cy="270" rx="120" ry="60"  fill="none" stroke="#00ffff" stroke-width="1.2" stroke-opacity="0.7" />
    <ellipse cx="400" cy="270" rx="75"  ry="37.5" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-opacity="0.9" />
    <ellipse cx="400" cy="270" rx="40"  ry="20"   fill="none" stroke="#9900ff" stroke-width="1.8" stroke-opacity="1" />
  </g>

  <!-- Asymmetrical Tensor Grid Lines (Geodesics bending inward) -->
  <g stroke="#0077ff" stroke-opacity="0.4" stroke-width="1" fill="none">
    <!-- Horizontal Geodesics distorted by gravity field -->
    <path d="M 50 150 Q 200 160 400 220 T 750 150" />
    <path d="M 50 200 Q 200 220 400 245 T 750 200" />
    <path d="M 50 250 Q 200 280 400 267 T 750 250" />
    <path d="M 50 300 Q 200 320 400 285 T 750 300" />
    <path d="M 50 350 Q 200 350 400 300 T 750 350" />

    <!-- Vertical Geodesics distorted by gravity field -->
    <path d="M 150 50 Q 200 200 340 270 T 150 450" />
    <path d="M 250 50 Q 280 200 370 270 T 250 450" />
    <path d="M 350 50 Q 360 200 390 270 T 350 450" />
    <path d="M 450 50 Q 440 200 410 270 T 450 450" />
    <path d="M 550 50 Q 520 200 430 270 T 550 450" />
    <path d="M 650 50 Q 600 200 460 270 T 650 450" />
  </g>

  <!-- Singularity / Core Gravity Well Void -->
  <circle cx="400" cy="270" r="60" fill="url(#singularity)" />
  <circle cx="400" cy="270" r="12" fill="#000000" stroke="#00ffff" stroke-width="1" />

  <!-- Orbiting Test Mass Particles / Vectors -->
  <!-- Particle 1 (Approaching Well) -->
  <circle cx="280" cy="210" r="4" fill="url(#particle-glow)" />
  <path d="M 240 190 L 275 207" stroke="#00ffff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="235" y="180" font-family="monospace" font-size="9" fill="#00ffff" opacity="0.7">v_vector [0.74c]</text>

  <!-- Particle 2 (In Acceleration Phase) -->
  <circle cx="485" cy="225" r="3" fill="url(#particle-glow)" />
  <path d="M 515 195 L 490 220" stroke="#ff00aa" stroke-width="1.5" opacity="0.8" />
  <text x="523" y="195" font-family="monospace" font-size="9" fill="#ff00aa" opacity="0.8">F_gravity</text>

  <!-- Metric Overlay Coordinates -->
  <g font-family="monospace" font-size="9" fill="#5577aa" opacity="0.5">
    <text x="415" y="265">r_s</text>
    <text x="530" y="280">g_μν tensor displacement</text>
    <text x="680" y="460">M_flat = E</text>
    <text x="40" y="460">Scale: 10⁻³⁵ m</text>
  </g>

  <!-- Technical Crosshairs inside well context -->
  <line x1="400" y1="230" x2="400" y2="245" stroke="#00ffff" stroke-width="1" opacity="0.4" />
  <line x1="400" y1="295" x2="400" y2="310" stroke="#00ffff" stroke-width="1" opacity="0.4" />
  <line x1="350" y1="270" x2="365" y2="270" stroke="#00ffff" stroke-width="1" opacity="0.4" />
  <line x1="435" y1="270" x2="450" y2="270" stroke="#00ffff" stroke-width="1" opacity="0.4" />

</svg>
