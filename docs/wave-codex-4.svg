<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7e5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feb47b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>

  <!-- The Continuous Wave Path -->
  <path d="M 50 200 Q 150 50, 250 200 T 450 200 T 650 200 T 850 200" 
        fill="none" 
        stroke="url(#waveGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-dasharray" values="20,100; 50,100; 20,100" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Seven Rings Nodes -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="100" cy="200" r="6" />
    <circle cx="200" cy="200" r="6" />
    <circle cx="300" cy="200" r="6" />
    <circle cx="400" cy="200" r="6" />
    <circle cx="500" cy="200" r="6" />
    <circle cx="600" cy="200" r="6" />
    <circle cx="700" cy="200" r="6" />
  </g>

  <!-- Text Overlay -->
  <text x="400" y="320" font-family="sans-serif" font-size="24" fill="#feb47b" text-anchor="middle" letter-spacing="4">
    WAVE-CODEX-7
  </text>
  <text x="400" y="350" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">
    CONTINUOUS TRAVELING CONTRACTION WAVE
  </text>
</svg>
