      <svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
          </radialGradient>
          <linearGradient id="sweep-line" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:#7000ff;stop-opacity:0" />
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- Background -->
        <rect width="500" height="500" fill="url(#bg-glow)"/>
        <!-- Grid Lines -->
        <g stroke="#1e293b" stroke-width="1">
          <line x1="50" y1="250" x2="450" y2="250" />
          <line x1="250" y1="50" x2="250" y2="450" />
          <circle cx="250" cy="250" r="50" fill="none" stroke-dasharray="2,4"/>
          <circle cx="250" cy="250" r="100" fill="none" />
          <circle cx="250" cy="250" r="150" fill="none" stroke-dasharray="5,5"/>
          <circle cx="250" cy="250" r="200" fill="none" />
        </g>
        <!-- 6D Manifold Projection (Calabi-Yau approximation) -->
        <path d="M250 50 C 380 100, 450 200, 250 250 C 50 200, 120 100, 250 50" fill="none" stroke="#7000ff" stroke-width="1.5" opacity="0.6"/>
        <path d="M250 250 C 450 300, 380 400, 250 450 C 120 400, 50 300, 250 250" fill="none" stroke="#7000ff" stroke-width="1.5" opacity="0.6"/>
        <path d="M50 250 C 100 120, 200 50, 250 250 C 200 450, 100 380, 50 250" fill="none" stroke="#00f2ff" stroke-width="1.5" opacity="0.4"/>
        <path d="M250 250 C 300 50, 400 120, 450 250 C 400 380, 300 450, 250 250" fill="none" stroke="#00f2ff" stroke-width="1.5" opacity="0.4"/>
        <!-- Sweep Beam -->
        <polygon points="250,250 420,130 450,250" fill="url(#sweep-line)" opacity="0.3"/>
        <line x1="250" y1="250" x2="420" y2="130" stroke="#00f2ff" stroke-width="2" filter="url(#glow)"/>
        <!-- Detected Anomalies / Void Pockets -->
        <circle cx="120" cy="180" r="6" fill="#ff0055" filter="url(#glow)"/>
        <circle cx="120" cy="180" r="12" fill="none" stroke="#ff0055" stroke-width="1" opacity="0.8"/>
        <text x="135" y="184" font-family="monospace" font-size="10" fill="#ff0055">VOID_PKT_01</text>
        
        <circle cx="340" cy="320" r="4" fill="#ffaa00" filter="url(#glow)"/>
        <text x="355" y="324" font-family="monospace" font-size="10" fill="#ffaa00">FLUX_DEV_02</text>
        <!-- Core Node -->
        <circle cx="250" cy="250" r="8" fill="#ffffff" filter="url(#glow)"/>
        <text x="250" y="230" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">NODE_0023</text>
      </svg>
