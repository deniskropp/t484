<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#9013fe;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Layer 1: Background Flow -->
  <rect x="40" y="50" width="10" height="100" rx="2" fill="url(#flowGradient)" opacity="0.3" transform="rotate(-10 45 100)" />
  
  <!-- Layer 2: Mid Flow -->
  <rect x="70" y="50" width="10" height="100" rx="2" fill="url(#flowGradient)" opacity="0.6" transform="rotate(-10 75 100)" />
  
  <!-- Layer 3: Foreground Flow -->
  <rect x="100" y="50" width="10" height="100" rx="2" fill="url(#flowGradient)" opacity="1" transform="rotate(-10 105 100)" />
  
  <!-- The Cross/Relation element (⫻) -->
  <path d="M 60 100 L 140 100 M 100 60 L 100 140" stroke="#333" stroke-width="4" stroke-linecap="round" />
</svg>
