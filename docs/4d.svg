      <svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f2ff" />
          </marker>
        </defs>
        <!-- Tesseract Frame -->
        <rect x="150" y="150" width="200" height="200" fill="none" stroke="#00f2ff" stroke-width="2"/>
        <rect x="200" y="200" width="200" height="200" fill="none" stroke="#7000ff" stroke-width="2"/>
        <line x1="150" y1="150" x2="200" y2="200" stroke="#ffffff" stroke-width="1"/>
        <line x1="350" y1="150" x2="400" y2="200" stroke="#ffffff" stroke-width="1"/>
        <line x1="150" y1="350" x2="200" y2="400" stroke="#ffffff" stroke-width="1"/>
        <line x1="350" y1="350" x2="400" y2="400" stroke="#ffffff" stroke-width="1"/>
        <!-- Temporal Flow Vector -->
        <path d="M250 250 L450 50" stroke="#00f2ff" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 5"/>
        <text x="450" y="50" font-family="monospace" font-size="12" fill="#00f2ff">TIME_VECTOR</text>
      </svg>
