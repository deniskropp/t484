    <svg width="100%" height="600px" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
      <rect width="800" height="600" fill="#050505"/>
      
      <!-- Triadic Nodes -->
      <circle cx="400" cy="150" r="40" fill="#1a1a1a" stroke="#00f2ff" stroke-width="2"/>
      <circle cx="250" cy="450" r="60" fill="#1a1a1a" stroke="#ff007a" stroke-width="3"/>
      <circle cx="550" cy="450" r="40" fill="#1a1a1a" stroke="#7a00ff" stroke-width="2"/>

      <!-- Active Wave Propagation -->
      <g id="WavePropagation">
        <!-- DimaCore Pulse -->
        <circle cx="250" cy="450" r="60" fill="none" stroke="#ff007a" stroke-width="2">
          <animate attributeName="r" from="60" to="150" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="0.8" to="0" dur="3s" repeatCount="indefinite"/>
        </circle>
        <!-- FizzOrchestrator Pulse -->
        <circle cx="550" cy="450" r="40" fill="none" stroke="#7a00ff" stroke-width="2">
          <animate attributeName="r" from="40" to="120" dur="3s" begin="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="0.8" to="0" dur="3s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <!-- DenisHost Pulse -->
        <circle cx="400" cy="150" r="40" fill="none" stroke="#00f2ff" stroke-width="2">
          <animate attributeName="r" from="40" to="100" dur="3s" begin="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="0.8" to="0" dur="3s" begin="2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Data Flow Lines -->
      <path d="M400 190 L250 450 M400 190 L550 450 M250 450 L550 450" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="10,5">
        <animate attributeName="stroke-dashoffset" from="0" to="30" dur="2s" repeatCount="indefinite"/>
      </path>
    </svg>
