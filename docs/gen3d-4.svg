      <svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
        <!-- The Meta-Void (Parent Context) -->
        <rect x="20" y="20" width="460" height="460" rx="40" fill="#050505" stroke="#333" stroke-width="2" stroke-dasharray="10 5"/>
        <text x="40" y="50" font-family="monospace" font-size="12" fill="#666">CONTEXT_ROOT: ../</text>

        <!-- Node-01 (The Child) -->
        <rect x="150" y="150" width="200" height="200" rx="30" fill="#0f172a" stroke="#00ffcc" stroke-width="2"/>
        <text x="250" y="255" font-family="monospace" font-size="14" fill="#00ffcc" text-anchor="middle">NODE-01</text>
        
        <!-- The Recursive Link -->
        <line x1="250" y1="150" x2="250" y2="20" stroke="#666" stroke-width="2" stroke-dasharray="5 5"/>
        <circle cx="250" cy="20" r="5" fill="#666"/>
        <text x="260" y="35" font-family="monospace" font-size="10" fill="#666">PARENT_LINK</text>
      </svg>
