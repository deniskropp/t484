      <svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9013fe;stop-opacity:1" />
          </linearGradient>
        </defs>
        <!-- Grid Background -->
        <rect width="400" height="400" fill="#0f172a" />
        <path d="M40 0 V400 M80 0 V400 M120 0 V400 M160 0 V400 M200 0 V400 M240 0 V400 M280 0 V400 M320 0 V400 M360 0 V400" stroke="#1e293b" stroke-width="1"/>
                                                         <!-- Sweep Line -->
        <line x1="0" y1="200" x2="400" y2="200" stroke="url(#grad1)" stroke-width="3" stroke-dasharray="10,5">
          <animate attributeName="y1" values="0;400;0" dur="4s" repeatCount="indefinite" />
          <animate attributeName="y2" values="0;400;0" dur="4s" repeatCount="indefinite" />
        </line>
        <!-- Anomaly Nodes -->
        <circle cx="120" cy="120" r="6" fill="#f59e0b" />
        <circle cx="280" cy="280" r="6" fill="#f59e0b" />
        <text x="10" y="390" fill="#64748b" font-family="monospace" font-size="12">6D_MANIFOLD_SWEEP_ACTIVE</text>
          </svg>
