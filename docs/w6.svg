      <svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
        <style>
          .ring { fill: none; stroke: #7000ff; stroke-width: 1; }
          .torque-vector { stroke: #00ff9d; stroke-width: 2; marker-end: url(#arrowhead); }
        </style>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#00ff9d" />
          </marker>
        </defs>
        <!-- Rotational Rings -->
        <ellipse cx="300" cy="200" rx="150" ry="50" class="ring" />
        <ellipse cx="300" cy="200" rx="50" ry="150" class="ring" />
        <circle cx="300" cy="200" r="100" class="ring" />
        
        <!-- Torque Vectors -->
        <line x1="300" y1="200" x2="400" y2="100" class="torque-vector" />
        <text x="410" y="100" fill="#00ff9d" font-size="12">Torque: 0.84φ</text>
        
        <!-- Status Indicator -->
        <rect x="20" y="20" width="120" height="30" fill="#1a1a1a" stroke="#00f2ff" />
        <text x="30" y="40" fill="#00f2ff" font-size="14">W6: STABLE</text>
      </svg>
